name: Validate MintMaker configuration with renovate-config-validator
author: Hozifa Wasfy
branding:
  icon: check
  color: green
description: |
  Validate MintMaker configuration with renovate-config-validator.
inputs:
  config_file:
    description: |
      Renovate configuration file
      By default, it validates every file that matches renovate configuration files. 

    required: false
  repository_config:
    description: |
      Whether to treat configuration files as repository-level configs (passes --no-global).
      Set to 'false' to validate as global self-hosted configuration.
      Defaults to 'true' for repository-level validation.
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Validate Renovate configuration with renovate-config-validator
      run: |
        set -eu

        # Determine validator flags based on repository_config input
        VALIDATOR_FLAGS=""
        if [ "${REPOSITORY_CONFIG:-true}" = "true" ]; then
          VALIDATOR_FLAGS="--no-global"
        fi

        if [ -n "$CONFIG_FILE_PATH" ] && [ -f "$CONFIG_FILE_PATH" ]; then
          echo "Validating config_file: " "$CONFIG_FILE_PATH"
          echo "Using validator flags: $VALIDATOR_FLAGS"
          
          config_path="$(pwd)/$CONFIG_FILE_PATH"
          echo $config_path
          
          podman run --rm \
          -v $config_path:/workspace/renovate.json:ro,Z \
          quay.io/konflux-ci/mintmaker-renovate-image:latest \
          renovate-config-validator $VALIDATOR_FLAGS /workspace/renovate.json > validation.log

          cat validation.log

          echo "finished validating"
          
          if grep -qi "ERROR" validation.log; then
            exit 1
          else
            exit 0
          fi

        fi
        
        echo "No config file was set"
        echo "Detecting renovate configuration files..."

        mkdir /opt/renovate-configs

        renovate_files=$(find . -name "*renovate*.json*")

        for f in $renovate_files; do
          if [ -f $f ]; then
            echo "Renovate file detected: $f"
            cp $f /opt/renovate-configs
          fi
        done 

        if [ -z $(ls /opt/renovate-configs) ]; then
          echo "No config files found"
          exit 1
        fi
        
        echo "Using validator flags: $VALIDATOR_FLAGS"
        
        podman run --rm \
        -v /opt/renovate-configs:/workspace/renovate-configs \
        quay.io/konflux-ci/mintmaker-renovate-image:latest \
        renovate-config-validator $VALIDATOR_FLAGS /workspace/renovate-configs/renovate.json > validation.log

        cat validation.log

        if grep -qi "ERROR" validation.log; then
          exit 1
        else
          exit 0
        fi

      shell: bash
      env:
        CONFIG_FILE_PATH: ${{inputs.config_file}}
        REPOSITORY_CONFIG: ${{inputs.repository_config}}
