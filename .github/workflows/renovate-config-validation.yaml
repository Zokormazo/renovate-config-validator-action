name: "Validate renovate.json config file"

on:
  push:
    branches: 
      - main
  pull_request:
   
jobs:
  test-basic-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          config_file: test/renovate.json

  test-matchbasebranches-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          config_file: test/matchbasebranches.json
